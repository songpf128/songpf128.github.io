<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>克/元 ↔ 元/斤 双向换算</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#7b8794;
    --line:#e5eaf2;
    --blue:#2563eb;
    --cyan:#0ea5e9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, #dbeafe 0%, transparent 60%),
      radial-gradient(700px 500px at 110% 15%, #d1fae5 0%, transparent 55%),
      #f6f8fc;
    color:var(--ink);
    padding: calc(26px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
    min-height:100vh;
  }
  .wrap{width:100%;max-width:420px;}

  header{text-align:center;}
  h1{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.3px;}
  .sub{margin:0 0 18px;font-size:13.5px;color:var(--muted);}

  .card{
    background:#fff;
    border-radius:22px;
    padding:18px 16px 16px;
    box-shadow:0 10px 30px -18px rgba(15,23,42,.35), 0 2px 8px -4px rgba(15,23,42,.08);
  }
  .card + .card{margin-top:16px;}
  .card-title{
    font-size:15px;font-weight:800;margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .card-title .dot{
    width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--cyan));
  }

  .field + .field{margin-top:12px;}
  .field label{
    display:block;
    font-size:12.5px;font-weight:700;color:var(--muted);
    margin-bottom:6px;letter-spacing:.3px;
  }
  .input-row{
    display:flex;align-items:center;gap:8px;
    background:#f4f7fb;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:11px 14px;
    transition:border-color .18s, background .18s, box-shadow .18s;
  }
  .input-row:focus-within{
    border-color:var(--blue);
    background:#fff;
    box-shadow:0 0 0 4px rgba(37,99,235,.10);
  }
  .input-row input{
    border:none;background:transparent;outline:none;
    width:100%;padding:0;
    font-family:inherit;
    font-size:clamp(22px,6.5vw,26px);
    font-weight:800;
    color:var(--ink);
    letter-spacing:.4px;
    font-variant-numeric:tabular-nums;
  }
  .input-row input::placeholder{color:#c3cddb;font-weight:700;}
  .unit{flex:none;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;}

  .result{
    margin-top:14px;
    background:linear-gradient(135deg,#eff6ff,#f0fdfa);
    border:1px solid #dbeafe;
    border-radius:16px;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .result .label{font-size:13px;font-weight:700;color:#64748b;flex:none;}
  .result .value{
    font-size:clamp(22px,6.5vw,28px);
    font-weight:800;letter-spacing:-.5px;
    color:var(--blue);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    display:flex;align-items:baseline;gap:2px;
  }
  .result .value .pre{font-size:14px;font-weight:700;color:#64748b;}
  .result .value small{font-size:14px;font-weight:700;color:#64748b;}

  .clear-btn{
    width:100%;margin-top:18px;padding:13px;
    border:none;border-radius:16px;
    background:#f1f5fb;color:#64748b;
    font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:background .18s, transform .12s;
  }
  .clear-btn:active{background:#e2e8f2;transform:scale(.985);}

  .tip{
    margin:18px 4px 0;
    font-size:12.5px;color:#94a3b8;
    text-align:center;line-height:1.75;
  }
  .tip strong{color:#64748b;font-weight:600;}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>克/元 ↔ 元/斤</h1>
    <p class="sub">上下双向联动 · 自动换算</p>
  </header>

  <!-- 上方：按克输入，结果 = 元/斤 -->
  <section class="card">
    <h2 class="card-title"><span class="dot"></span>按克输入</h2>

    <div class="field">
      <label for="g1">重量（克）</label>
      <div class="input-row">
        <input id="g1" type="text" inputmode="decimal" placeholder="例如 150" autocomplete="off" enterkeyhint="next">
        <span class="unit">克</span>
      </div>
    </div>

    <div class="field">
      <label for="p1">价格（元）</label>
      <div class="input-row">
        <input id="p1" type="text" inputmode="decimal" placeholder="例如 5.5" autocomplete="off" enterkeyhint="done">
        <span class="unit">元</span>
      </div>
    </div>

    <div class="result">
      <span class="label">折合单价</span>
      <span class="value"><span id="out1">--</span><small>元/斤</small></span>
    </div>
  </section>

  <!-- 下方：按斤输入，结果 = 100克/xx元 -->
  <section class="card">
    <h2 class="card-title"><span class="dot"></span>按斤输入</h2>

    <div class="field">
      <label for="p2">价格（元）</label>
      <div class="input-row">
        <input id="p2" type="text" inputmode="decimal" placeholder="例如 5.5" autocomplete="off" enterkeyhint="next">
        <span class="unit">元</span>
      </div>
    </div>

    <div class="field">
      <label for="j2">重量（斤）</label>
      <div class="input-row">
        <input id="j2" type="text" inputmode="decimal" placeholder="例如 0.3" autocomplete="off" enterkeyhint="done">
        <span class="unit">斤</span>
      </div>
    </div>

    <div class="result">
      <span class="label">折合单价</span>
      <span class="value">
        <span class="pre">100克 /</span>
        <span id="out2">--</span>
        <small>元</small>
      </span>
    </div>
  </section>

  <button id="clear" class="clear-btn" type="button">清空全部</button>

  <p class="tip">
    <strong>1 斤 = 500 克</strong><br>
    上方结果：元/斤 = 价格 ÷ 克重 × 500<br>
    下方结果：100克价格 = 斤单价 ÷ 5
  </p>
</main>

<script>
(function () {
  var g1 = document.getElementById('g1');
  var p1 = document.getElementById('p1');
  var p2 = document.getElementById('p2');
  var j2 = document.getElementById('j2');
  var out1 = document.getElementById('out1');
  var out2 = document.getElementById('out2');

  /* 只允许数字和一个小数点 */
  function sanitize(el) {
    var raw = el.value;
    var v = raw.replace(/[^\d.]/g, '');
    var i = v.indexOf('.');
    if (i > -1) {
      v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '');
    }
    if (v !== raw) el.value = v;
  }

  function num(el) {
    var n = parseFloat(el.value);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  function fmt(n) {
    if (!isFinite(n) || n <= 0) return '--';
    return n.toFixed(2);
  }

  function clearResults() {
    out1.textContent = '--';
    out2.textContent = '--';
  }

  /* 根据上方（克 + 元）更新下方与两个结果 */
  function updateFromG() {
    var g = num(g1);
    var p = num(p1);

    if (g > 0 && p > 0) {
      var jin = g / 500;
      // 同步下方
      p2.value = p.toFixed(2);
      j2.value = jin.toFixed(2);
      // 上方结果：元/斤
      out1.textContent = fmt(p / g * 500);
      // 下方结果：100克多少钱
      out2.textContent = fmt(p / g * 100);
    } else {
      clearResults();
    }
  }

  /* 根据下方（元 + 斤）更新上方与两个结果 */
  function updateFromJ() {
    var p = num(p2);
    var j = num(j2);

    if (p > 0 && j > 0) {
      var grams = j * 500;
      // 同步上方
      p1.value = p.toFixed(2);
      g1.value = grams.toFixed(2);
      // 上方结果：元/斤
      out1.textContent = fmt(p / j);
      // 下方结果：100克多少钱 = 斤单价 ÷ 5
      out2.textContent = fmt(p / j / 5);
    } else {
      clearResults();
    }
  }

  /* 输入过滤 + 联动 */
  g1.addEventListener('input', function () {
    sanitize(g1);
    updateFromG();
  });
  p1.addEventListener('input', function () {
    sanitize(p1);
    updateFromG();
  });
  p2.addEventListener('input', function () {
    sanitize(p2);
    updateFromJ();
  });
  j2.addEventListener('input', function () {
    sanitize(j2);
    updateFromJ();
  });

  /* 失焦格式化为两位小数 */
  function formatOnBlur(el) {
    if (el.value.trim() === '') return;
    var n = parseFloat(el.value);
    if (isFinite(n) && n > 0) {
      el.value = n.toFixed(2);
    } else {
      el.value = '';
    }
  }
  [g1, p1, p2, j2].forEach(function (el) {
    el.addEventListener('blur', function () { formatOnBlur(el); });
  });

  /* 清空全部 */
  document.getElementById('clear').addEventListener('click', function () {
    g1.value = '';
    p1.value = '';
    p2.value = '';
    j2.value = '';
    clearResults();
    g1.focus();
  });
})();
</script>
</body>
</html>
